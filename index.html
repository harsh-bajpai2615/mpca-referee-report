<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Referee Report</title>
<meta name="description" content="Fill the MPCA Match Referee Report 2026-27 on the phone and get the PDF in the prescribed format.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Referee Report">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section id="home" class="view" hidden></section>
  <section id="step" class="view" hidden></section>
  <section id="finish" class="view" hidden></section>
</main>

<nav id="bar" class="bar" aria-label="Actions"></nav>

<dialog id="zoom" class="zoom" aria-label="Form, larger">
  <div id="zoom-frame"></div>
  <p class="fine">Pinch to zoom. Tap to close.</p>
</dialog>

<dialog id="new-dialog" class="sheet" aria-labelledby="new-title">
  <h2 id="new-title">Start a new match ?</h2>
  <p>This clears this match's answers. Your name and signature stay. Send this match's PDF first.</p>
  <div class="sheet-actions">
    <button type="button" id="new-yes" class="pill danger">Clear and start new</button>
    <button type="button" class="pill ghost" data-close>Keep this match</button>
  </div>
</dialog>

<script src="pdf-lib.min.js"></script>
<script src="spec.js"></script>
<script src="signature.js"></script>
<script src="app.js"></script>
</body>
</html>
